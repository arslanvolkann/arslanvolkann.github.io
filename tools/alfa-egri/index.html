/* α(T) eğri aracı — görünüm. Athermal Bağ Hesabı web v3.0 src/style.css'ten kopyalanıp uyarlandı (2026-11-27 anlık kopya):
   açık/koyu tema jetonları, üst çubuk, sekmeler, düzen, girdi alanları, kartlar, grafikler, tema/dil menüsü, yazdırma, α(T) bileşenleri.
   Yılbaşı teması ve Athermal'e özgü bölümler alınmadı. Bu araca özgü kurallar dosyanın sonunda. */
:root{
  color-scheme: light;
  --bg:#f2f4f6; --surface:#ffffff; --surface2:#e9edf1; --ink:#15202b; --ink2:#46535f; --line:#cfd7de; --line2:#e1e6ea; --field-line:#7d8a96; --ph:#5d6a76;
  --accent:#1d5b88; --accent-ink:#ffffff; --focus:#0b63c4;
  --ok:#14683a; --ok-bg:#e1f2e7; --warn:#7f5200; --warn-bg:#fcefcf; --fail:#a1242a; --fail-bg:#fae3e2;
  --nodata:#46525d; --nodata-bg:#e4e9ed; --info:#195689; --info-bg:#dfecf8;
  --c-bond:#b4500f; --c-d1:#16783d; --c-d2:#7a3fa8; --c-d3:#8a6200; --c-d4:#b0177d; --c-d5:#1a6aa8; --asm:#9a4a08; --asm-bg:#fde3c8; --sel-bg:#fff2cc; --hatch:#aab4be;
  --font:system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif;
  --mono:ui-monospace, 'SF Mono', Menlo, Consolas, 'Roboto Mono', 'Noto Sans Mono', 'DejaVu Sans Mono', 'Droid Sans Mono', monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#10151a; --surface:#182028; --surface2:#212b35; --ink:#e5ebf0; --ink2:#a2afbc; --line:#334150; --line2:#27323d; --field-line:#6d7f91; --ph:#98a6b3;
    --accent:#74b3e4; --accent-ink:#0c1218; --focus:#8cc4f5;
    --ok:#83d6a0; --ok-bg:#16301f; --warn:#f0c468; --warn-bg:#3a2d0f; --fail:#ff9d9a; --fail-bg:#3f1c1c;
    --nodata:#aab5c0; --nodata-bg:#28323b; --info:#8fc4f3; --info-bg:#172c41;
  --c-bond:#f2a15f; --c-d1:#7fd79e; --c-d2:#c9a0ee; --c-d3:#e8c15a; --c-d4:#ffb3e6; --c-d5:#5fd4d0; --asm:#f5b27a; --asm-bg:#4a2c12; --sel-bg:#3b3515; --hatch:#4b5a68;
  }
}
/* açık tema açıkça seçildiyse (sistem koyu olsa da) tüm değişkenler yeniden yazılır: tarayıcıdaki iç içe medya/:not işleme farklarına bağlı kalmaz */
:root[data-theme="light"]{

  color-scheme: light;
  --bg:#f2f4f6; --surface:#ffffff; --surface2:#e9edf1; --ink:#15202b; --ink2:#46535f; --line:#cfd7de; --line2:#e1e6ea; --field-line:#7d8a96; --ph:#5d6a76;
  --accent:#1d5b88; --accent-ink:#ffffff; --focus:#0b63c4;
  --ok:#14683a; --ok-bg:#e1f2e7; --warn:#7f5200; --warn-bg:#fcefcf; --fail:#a1242a; --fail-bg:#fae3e2;
  --nodata:#46525d; --nodata-bg:#e4e9ed; --info:#195689; --info-bg:#dfecf8;
  --c-bond:#b4500f; --c-d1:#16783d; --c-d2:#7a3fa8; --c-d3:#8a6200; --c-d4:#b0177d; --c-d5:#1a6aa8; --asm:#9a4a08; --asm-bg:#fde3c8; --sel-bg:#fff2cc; --hatch:#aab4be;
  --font:system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', Arial, sans-serif;
  --mono:ui-monospace, 'SF Mono', Menlo, Consolas, 'Roboto Mono', 'Noto Sans Mono', 'DejaVu Sans Mono', 'Droid Sans Mono', monospace;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10151a; --surface:#182028; --surface2:#212b35; --ink:#e5ebf0; --ink2:#a2afbc; --line:#334150; --line2:#27323d; --field-line:#6d7f91; --ph:#98a6b3;
  --accent:#74b3e4; --accent-ink:#0c1218; --focus:#8cc4f5;
  --ok:#83d6a0; --ok-bg:#16301f; --warn:#f0c468; --warn-bg:#3a2d0f; --fail:#ff9d9a; --fail-bg:#3f1c1c;
  --nodata:#aab5c0; --nodata-bg:#28323b; --info:#8fc4f3; --info-bg:#172c41;
  --c-bond:#f2a15f; --c-d1:#7fd79e; --c-d2:#c9a0ee; --c-d3:#e8c15a; --c-d4:#ffb3e6; --c-d5:#5fd4d0; --asm:#f5b27a; --asm-bg:#4a2c12; --sel-bg:#3b3515; --hatch:#4b5a68;
}
/* Yılbaşı teması (dekor renkleri --hx-* yalnız holiday.js içinde): palet ayrı bir jeton kümesi; açık "karlı gün" türevi aynı adlarla eklenebilir */
:root[data-theme="holiday"]{
  color-scheme: dark;
  --bg:#0d1524; --surface:#142034; --surface2:#1c2a42; --ink:#edf2f8; --ink2:#b2bfd0; --line:#2d3c58; --line2:#223049; --field-line:#7a8dab; --ph:#9dabbf;
  --accent:#8cc8f0; --accent-ink:#0b1424; --focus:#ffd479;
  --ok:#83d6a0; --ok-bg:#16301f; --warn:#f0c468; --warn-bg:#3a2d0f; --fail:#ff9d9a; --fail-bg:#3f1c1c;
  --nodata:#aab5c0; --nodata-bg:#28323b; --info:#8fc4f3; --info-bg:#172c41;
  --c-bond:#f2a15f; --c-d1:#7fd79e; --c-d2:#c9a0ee; --c-d3:#e8c15a; --c-d4:#ffb3e6; --c-d5:#5fd4d0; --asm:#f5b27a; --asm-bg:#4a2c12; --sel-bg:#3b3515; --hatch:#4b5a68;
}
/* Yılbaşı "karlı gün" varyantı: aynı jeton adları, ayrı blok; seçim ayarlar panelinden (data-hol-var="day") */
:root[data-theme="holiday"][data-hol-var="day"]{
  color-scheme: light;
  --bg:#e4edf7; --surface:#f8fbff; --surface2:#e6eef8; --ink:#14202e; --ink2:#415163; --line:#b5c5d8; --line2:#d3deea; --field-line:#6a7e96; --ph:#51627a;
  --accent:#1a5a91; --accent-ink:#ffffff; --focus:#0b63c4;
  --ok:#14683a; --ok-bg:#e1f2e7; --warn:#7f5200; --warn-bg:#fcefcf; --fail:#a1242a; --fail-bg:#fae3e2;
  --nodata:#46525d; --nodata-bg:#e4e9ed; --info:#195689; --info-bg:#dfecf8;
  --c-bond:#b4500f; --c-d1:#16783d; --c-d2:#7a3fa8; --c-d3:#8a6200; --c-d4:#b0177d; --c-d5:#1a6aa8; --asm:#9a4a08; --asm-bg:#fde3c8; --sel-bg:#fff2cc; --hatch:#aab4be;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);font-variant-numeric:tabular-nums;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* üst çubuk */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .row1{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:3px;padding-bottom:3px}
.top .row1>div{min-width:0}
.top h1{font-size:15px;line-height:1.2;margin:0;font-weight:600;letter-spacing:.005em;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow-wrap:anywhere}
.chip{display:inline-block;border-radius:5px;padding:3px 9px;font-weight:600;font-size:13px;line-height:1.35;border:1px solid transparent;white-space:nowrap}
.top .chip{min-height:44px;display:inline-flex;align-items:center;flex:none;cursor:pointer}
.top .chip .cf{display:none}
.s-ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.s-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.s-fail{color:var(--fail);background:var(--fail-bg);border-color:var(--fail);border-color:color-mix(in srgb,var(--fail) 35%,transparent)}
.s-nodata{color:var(--nodata);background:var(--nodata-bg);border-color:var(--nodata);border-color:color-mix(in srgb,var(--nodata) 35%,transparent)}
.s-info{color:var(--info);background:var(--info-bg);border-color:var(--info);border-color:color-mix(in srgb,var(--info) 35%,transparent)}
.s-none{color:var(--ink2);background:transparent;border-color:var(--line)}
.tabs{display:flex;gap:0;border-top:1px solid var(--line2)}
.tabs button{flex:1 1 auto;min-width:0;padding:0 6px;min-height:44px;background:transparent;border:0;border-bottom:3px solid transparent;font-weight:500;color:var(--ink2);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* düzen */
main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-top:14px;padding-bottom:40px}
#app[data-view="in"] #outPane,#app[data-view="in"] #docPane{display:none}
#app[data-view="out"] #inPane,#app[data-view="out"] #docPane{display:none}
#app[data-view="doc"] #inPane,#app[data-view="doc"] #outPane{display:none}
.tabs .td{display:none}
@media (min-width:900px){
  .tabs #tabOut{display:none}
  .tabs .tm{display:none}.tabs .td{display:inline}
  .tabs button{flex:0 0 auto;padding:0 26px}
  main{grid-template-columns:minmax(340px,430px) 1fr;align-items:start;gap:22px}
  #app[data-view="in"] #outPane,#app[data-view="in"] #inPane,#app[data-view="out"] #outPane,#app[data-view="out"] #inPane{display:block}   /* geniş ekranda girdi ve sonuç yan yana (Athermal düzeni) */
  #app[data-view="in"] #docPane,#app[data-view="out"] #docPane{display:none}
  #app[data-view="doc"] main{grid-template-columns:minmax(0,1fr)}
  #app[data-view="doc"] #docPane{display:block}
  .top .chip{max-width:none;min-height:34px}
  .top .chip .cf{display:inline}.top .chip .cs{display:none}
    .top .row1{padding-top:8px;padding-bottom:8px}
    .top h1{font-size:18px}
  /* α(T) aracı (kullanıcı 2026-11-27): sağ sütun kaydırma kutusu DEĞİL; yalnız üstteki sonuç kartı yapışkan, grafikler/rapor/tablo sayfayla akar.
     Yapışkanlığın kapsayıcısı #outPane olduğundan kart sütunun sonunda yukarı itilir; sonrasında tam genişlik bölüm olmadığı için üst üste binme olmaz (Athermal UX 3.2.7 sorunu). */
  #outPane{position:static;max-height:none;overflow:visible}
  #results>#verdict{position:sticky;top:calc(var(--hdr, 56px) + 12px);z-index:5;box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
}

/* girdiler */
details.grp{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:44px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .gt{flex:1;min-width:0}
.gb{display:inline-flex;align-items:center;gap:8px;flex:none}
.badge{font-size:12px;font-weight:500;color:var(--info);background:var(--info-bg);border-radius:10px;padding:1px 8px;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--fail);flex:none}
.inhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.inhead .tgl{display:flex;align-items:center;gap:8px;min-height:40px;font-size:13px;color:var(--ink2);cursor:pointer}
.tgl{display:flex;align-items:center;gap:8px;min-height:44px;margin-top:4px;font-size:13px;color:var(--ink2);cursor:pointer}
.tgl input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
.notice{font-size:12.5px;color:var(--info);background:var(--info-bg);border-radius:5px;padding:4px 8px;margin-top:4px}
.hint{margin:0}
.lnk{white-space:nowrap;background:none;border:0;padding:0 2px;min-height:40px;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:14px;text-align:left}
.undo{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--info-bg);color:var(--info);border-radius:6px;padding:2px 12px;margin-bottom:10px;font-size:14px}
details.grp>summary::after,details.xp>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin-right:3px;flex:none;transition:transform .12s}
details[open]>summary::after{transform:rotate(-135deg)}
details.grp .body{padding:2px 14px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
details.grp .body>*{min-width:0}
.fld{display:block}
.fld .lab{display:block;font-size:13px;color:var(--ink2);margin-bottom:3px}
.fld .lab b{font-weight:600;color:var(--ink)}
.fld .opt,.prtdlg .opt{display:inline-block;font-size:11px;line-height:1.5;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px;font-weight:400}
.fld .sym{font-family:var(--mono);font-size:12px;color:var(--ink2);margin-left:4px}
.ctl{min-width:0;max-width:100%;display:flex;align-items:stretch;border:1px solid var(--field-line);border-radius:6px;background:var(--surface);min-height:44px}
.ctl:focus-within{border-color:var(--focus);box-shadow:0 0 0 2px var(--focus);box-shadow:0 0 0 2px color-mix(in srgb,var(--focus) 35%,transparent)}
.ctl input,.ctl select{flex:1;min-width:0;background:transparent;border:0;padding:8px 10px;outline:none;font-variant-numeric:tabular-nums;font-size:16px}
.ctl input::placeholder{color:var(--ph);opacity:1}
.ctl select{width:100%;max-width:100%;text-overflow:ellipsis;appearance:auto}
.ctl .unit{display:flex;align-items:center;padding:0 10px;color:var(--ink2);font-size:13px;border-left:1px solid var(--line2);white-space:nowrap}
.ctl.bad{border-color:var(--fail);box-shadow:0 0 0 1px var(--fail)}
.fld .meta{font-size:12px;color:var(--ink2);margin-top:4px;overflow-wrap:anywhere}
.fld .meta.warnx{color:var(--warn)}
.fld .err{font-size:12px;color:var(--fail);margin-top:3px}
.hint{font-size:12px;color:var(--ink2);margin:0 0 2px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{min-height:44px;padding:0 14px;border-radius:6px;border:1px solid var(--field-line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}

/* sonuçlar */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 8px;font-weight:600;letter-spacing:.01em;color:var(--ink2);text-transform:none}
.verdict{border-left-width:6px}
.verdict.v-ok{border-left-color:var(--ok)}.verdict.v-warn{border-left-color:var(--warn)}.verdict.v-fail{border-left-color:var(--fail)}
.verdict .big{font-size:21px;font-weight:600;line-height:1.25;margin:2px 0 6px}
.verdict.v-ok .big{color:var(--ok)}.verdict.v-warn .big{color:var(--warn)}.verdict.v-fail .big{color:var(--fail)}
.note-line{font-size:13px;color:var(--ink2);margin:6px 0 0}
.draw{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.draw .t{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.draw ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.draw li{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.draw .warnbox{font-size:14px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:8px 10px}
.invbox{color:var(--fail);background:var(--fail-bg);border:1px solid var(--fail);border:1px solid color-mix(in srgb,var(--fail) 40%,transparent);border-radius:6px;padding:10px 12px;margin-top:8px}
.invbox ul{margin:6px 0 0;padding-left:20px}
.invbox .lnk{white-space:normal;color:var(--fail);display:inline;min-height:0;padding:6px 0;font-size:inherit;line-height:1.5}
.invbox li{padding:2px 0}
ol.dash{list-style:none;margin:0;padding:0}
ol.dash>li{border-top:1px solid var(--line2)}
ol.dash>li:first-child{border-top:0}
ol.dash>li.dsep{border-top:2px solid var(--line);padding:10px 0 2px}
.dsh{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
ol.dash>li.dsep p{margin:3px 0 0;color:var(--ink2)}
ol.dash details>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 0;min-height:44px}
ol.dash details>summary::-webkit-details-marker{display:none}
.dash .no{font-family:var(--mono);font-size:13px;color:var(--ink2);padding-top:2px}
.dash .lbl{font-weight:500}
.dash .val{font-size:14px;color:var(--ink);overflow-wrap:anywhere;margin-top:1px}
.dash .num{font-family:var(--mono);font-size:13.5px}
.dash .chip{font-size:12px;margin-top:1px}
.dash .more{padding:0 0 12px 30px;font-size:13px;color:var(--ink2)}
.dash .more p{margin:0 0 7px}
.dash .more p.k{margin-bottom:5px}
.dash .more .k{font-weight:600;color:var(--ink)}
.recs{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.recs li{font-size:14px;padding-left:12px;border-left:3px solid var(--line)}
.recs li.f-fail{border-left-color:var(--fail)}.recs li.f-warn{border-left-color:var(--warn)}.recs li.f-nodata{border-left-color:var(--nodata)}.recs li.f-info{border-left-color:var(--info)}.recs li.f-ok{border-left-color:var(--ok)}
.recs p{margin:2px 0 4px}
.recs ul.split{margin:2px 0 0;padding-left:18px}.recs ul.split li{border:0;padding:0 0 5px;font-size:14px}
.recs details.more2>summary{cursor:pointer;color:var(--accent);font-size:13px;min-height:32px;display:flex;align-items:center}
.recs .rh{font-weight:500;font-size:13px;margin-bottom:1px;color:var(--ink2)}   /* UX 3.2.6: kalın yalnız ilk cümlede (recHtml <b>) */
details.xp{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
details.xp>summary{list-style:none;cursor:pointer;padding:11px 14px;min-height:44px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.xp>summary::-webkit-details-marker{display:none}
details.xp .body{padding:0 14px 14px;font-size:13.5px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:6px 0 8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:12px;white-space:nowrap}

svg .mk{stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}svg .mk.mid{stroke:var(--ink);stroke-dasharray:none;stroke-width:1.6}

taneous α, ΔL/L points or polynomial), and to provide the result as a table, as CSV and as ΔL/L points that can be entered in the Athermal Bond Calculator.","Aus Wärmeausdehnungsdaten (Intervallmittel α, momentanes α, ΔL/L-Punkte oder Polynom) eine stetige, glatte α(T)- und ε(T)-Kurve erzeugen; das Ergebnis als Tabelle, CSV und als ΔL/L-Punkte für den Athermal-Klebespalt-Rechner ausgeben."],"Yöntemler":["Methods","Methoden"],"Her kaynak ΔL/L (ppm) düğümlerine çevrilir. İlk kaynak tabandır; sonrakiler yalnız mevcut veri aralığının dışında kalan kısımlarıyla eklenir ve sınır noktasında ε eşitlenir. Aralık ortalaması satırı: ε(T2) = ε(T1) + α·(T2 − T1), ε(T1) mevcut düğümlerden doğrusal okunur. Kendi çıkarım.":["Each source is converted to ΔL/L (ppm) nodes. The first source is the base; further sources are added only with their parts outside the current data range, and ε is matched at the boundary point. Interval mean row: ε(T2) = ε(T1) + α·(T2 − T1), ε(T1) is read linearly from the existing nodes. Own inference.","Jede Quelle wird in ΔL/L-Knoten (ppm) umgewandelt. Die erste Quelle ist die Basis; weitere werden nur mit ihren Teilen außerhalb des bisherigen Datenbereichs ergänzt, ε wird am Grenzpunkt angeglichen. Intervallmittel-Zeile: ε(T2) = ε(T1) + α·(T2 − T1), ε(T1) wird linear aus den vorhandenen Knoten gelesen. Eigene Annahme."],"{#0} °C düzenli düğümlerde min Σ((ε − y)/σ)² + λ·Σ(Δ³ε)². Δ³ε, α’nın eğriliğiyle orantılıdır. λ, χ² ≈ max(N, {#1}·χ²₀) olacak biçimde ikiye bölmeyle seçilir (χ²₀: neredeyse cezasız çözüm). Yöntem seçimi kendi çıkarım.":["On regular {#0} °C nodes: min Σ((ε − y)/σ)² + λ·Σ(Δ³ε)². Δ³ε is proportional to the curvature of α. λ is chosen by bisection so that χ² ≈ max(N, {#1}·χ²₀) (χ²₀: nearly unpenalised solution). Choice of method: own inference.","Auf regelmäßigen {#0}-°C-Knoten: min Σ((ε − y)/σ)² + λ·Σ(Δ³ε)². Δ³ε ist proportional zur Krümmung von α. λ wird per Bisektion so gewählt, dass χ² ≈ max(N, {#1}·χ²₀) (χ²₀: nahezu straffreie Lösung). Methodenwahl: eigene Annahme."],"Şekil kısıtı":["Shape constraint","Formbedingung"],"Pencere [alt, üst] içinde α azalmaz ⇔ Δ²ε ≥ {#0}; dış ceza yöntemiyle çözülür. Kısıtsız çözümde α’nın düştüğü her bölge ayrı sınanır: Δχ² ≤ eşik (varsayılan {#1}) ise düzeltilir; değilse veride gerçek α düşüşü kabul edilir, kısıt o bölgeden kaldırılır ve raporlanır. Kendi çıkarım.":["Within the window [lower, upper] α does not decrease ⇔ Δ²ε ≥ {#0}; solved with an exterior penalty method. Each region where α drops in the unconstrained solution is tested separately: if Δχ² ≤ threshold (default {#1}) it is corrected; otherwise a real drop of α in the data is assumed, the constraint is removed there and reported. Own inference.","Im Fenster [unten, oben] nimmt α nicht ab ⇔ Δ²ε ≥ {#0}; gelöst mit einem äußeren Strafverfahren. Jeder Bereich, in dem α in der Lösung ohne Bedingung abfällt, wird einzeln geprüft: bei Δχ² ≤ Schwelle (Standard {#1}) wird korrigiert; sonst gilt der Abfall als echt, die Bedingung wird dort aufgehoben und gemeldet. Eigene Annahme."],"Grüneisen bağıntısına göre metallerde α, ısı kapasitesiyle orantılıdır; ısı kapasitesinin biçimi Debye fonksiyonudur. Model: α(T) = A·D(T/θ) + B·T + C·T² (T kelvin, D: 3R’ye bölünmüş Debye ısı kapasitesi), ε = ∫α dT + ε0. A, B, C, ε0 ağırlıklı doğrusal en küçük kareler; θ {#0}…{#1} K ızgara ve altın bölme ile. θ bir uydurma parametresidir; fiziksel Debye sıcaklığı olarak yorumlanmamalıdır.":["According to the Grüneisen relation, α in metals is proportional to the heat capacity, whose shape is the Debye function. Model: α(T) = A·D(T/θ) + B·T + C·T² (T in kelvin, D: Debye heat capacity divided by 3R), ε = ∫α dT + ε0. A, B, C, ε0 by weighted linear least squares; θ by a {#0}…{#1} K grid and golden-section search. θ is a fit parameter; do not interpret it as the physical Debye temperature.","Nach der Grüneisen-Beziehung ist α bei Metallen proportional zur Wärmekapazität, deren Verlauf die Debye-Funktion ist. Modell: α(T) = A·D(T/θ) + B·T + C·T² (T in Kelvin, D: Debye-Wärmekapazität durch 3R), ε = ∫α dT + ε0. A, B, C, ε0 per gewichteter linearer Ausgleichsrechnung; θ über ein {#0}…{#1}-K-Raster und Goldener-Schnitt-Suche. θ ist ein Anpassungsparameter; nicht als physikalische Debye-Temperatur deuten."],"Yeterlilik: σ_m = √(σ² + (f·|ε|)² + ({#0}·max|ε|)²), f = %{#1} ile χ²/N ≤ {#2} ve pencerede α artan. Sağlanmazsa Otomatik yöntem düzgünleştirmeye geçer. f, eşikler ve modelin terimleri kendi çıkarım; katı hal fiziği ders kitabı bağıntısına dayanır, bu araç için ayrıca doğrulanmadı.":["Adequacy: with σ_m = √(σ² + (f·|ε|)² + ({#0}·max|ε|)²), f = {#1} %: χ²/N ≤ {#2} and α increasing in the window. If not met, the automatic method switches to smoothing. f, the thresholds and the model terms are own inference; based on the solid-state physics textbook relation, not separately validated for this tool.","Eignung: mit σ_m = √(σ² + (f·|ε|)² + ({#0}·max|ε|)²), f = {#1} %: χ²/N ≤ {#2} und α im Fenster steigend. Andernfalls wechselt die automatische Methode zur Glättung. f, die Schwellen und die Modellterme sind eigene Annahmen; beruhen auf der Lehrbuchbeziehung der Festkörperphysik, für dieses Werkzeug nicht gesondert validiert."],"NIST kriyojenik veri tabanı biçimi: ε(T) = Σ c_k·T^k (T kelvin), {#0}. ya da {#1}. derece; α türevden. Türev α güvenilmez, seyrek veride ve uçlarda kontrolden çıkabilir; karşılaştırma amaçlıdır.":["NIST cryogenic database format: ε(T) = Σ c_k·T^k (T in kelvin), degree {#0} or {#1}; α from the derivative. The derived α is unreliable and can run out of control with sparse data and at the ends; for comparison only.","Format der NIST-Kryo-Datenbank: ε(T) = Σ c_k·T^k (T in Kelvin), Grad {#0} oder {#1}; α aus der Ableitung. Das abgeleitete α ist unzuverlässig und kann bei spärlichen Daten und an den Enden ausbrechen; nur zum Vergleich."],"Örnek verilerin kaynakları":["Sources of the example data","Quellen der Beispieldaten"],"ASM International, Materials at Low Temperatures ({#0}): ΔL/L tabloları, Ti-6Al-4V ve Fe-{#1}6Ni, {#2}…{#3} K (yüzde, {#4} ondalık).":["ASM International, Materials at Low Temperatures ({#0}): ΔL/L tables, Ti-6Al-4V and Fe-{#1}6Ni, {#2}…{#3} K (percent, {#4} decimals).","ASM International, Materials at Low Temperatures ({#0}): ΔL/L-Tabellen, Ti-6Al-4V und Fe-{#1}6Ni, {#2}…{#3} K (Prozent, {#4} Nachkommastellen)."],"Aerospace Metals, Ti-6Al-4V Grade {#0} tavlı: dağıtıcı veri sayfası, {#1} °C’den ortalama α ({#2}…{#3} °C {#4}, {#5}…{#6} °C {#7} ×{#8}⁻⁶/K).":["Aerospace Metals, Ti-6Al-4V Grade {#0} annealed: distributor data sheet, mean α from {#1} °C ({#2}…{#3} °C {#4}, {#5}…{#6} °C {#7} ×{#8}⁻⁶/K).","Aerospace Metals, Ti-6Al-4V Grade {#0} geglüht: Händlerdatenblatt, mittleres α ab {#1} °C ({#2}…{#3} °C {#4}, {#5}…{#6} °C {#7} ×{#8}⁻⁶/K)."],"Matthey, FeNi36 Invar: üretici veri sayfası, {#0} °C’den ortalama α ({#1}…{#2} °C).":["Matthey, FeNi36 Invar: manufacturer data sheet, mean α from {#0} °C ({#1}…{#2} °C).","Matthey, FeNi36 Invar: Herstellerdatenblatt, mittleres α ab {#0} °C ({#1}…{#2} °C)."],"Rolled Alloys, Invar {#0}: üretici veri sayfası, {#1} °F’den ortalama α (°F tablosundan çevrilmiş); yalnız {#2} °C üstü satırlar eklenir.":["Rolled Alloys, Invar {#0}: manufacturer data sheet, mean α from {#1} °F (converted from the °F table); only rows above {#2} °C are added.","Rolled Alloys, Invar {#0}: Herstellerdatenblatt, mittleres α ab {#1} °F (aus der °F-Tabelle umgerechnet); nur Zeilen oberhalb {#2} °C werden ergänzt."],"NIST, Cryogenic Material Properties veri tabanı: polinom biçimi ve uzama denkleminin α’yı iyi vermediği uyarısı.":["NIST, Cryogenic Material Properties database: polynomial format and the caution that the expansion equation does not give α well.","NIST, Datenbank Cryogenic Material Properties: Polynomformat und der Hinweis, dass die Dehnungsgleichung α nicht gut wiedergibt."],"Üretici ve dağıtıcı veri sayfaları hakemli kaynak değildir; lot ve ısıl işleme göre değişir. Invar {#0}’nın α’sı lot ve ısıl işleme çok duyarlıdır.":["Manufacturer and distributor data sheets are not peer-reviewed sources; they vary with lot and heat treatment. The α of Invar {#0} is very sensitive to lot and heat treatment.","Hersteller- und Händlerdatenblätter sind keine begutachteten Quellen; sie schwanken mit Charge und Wärmebehandlung. Das α von Invar {#0} reagiert sehr empfindlich auf Charge und Wärmebehandlung."],"Kendi çıkarımlar ve sınırlar":["Own inferences and limitations","Eigene Annahmen und Grenzen"],"Kaynak birleşim kuralı, σ kuralları (yuvarlama payı, düzgün eğride %{#0}, referans noktasında {#1} ppm, ek σ tabanı) kendi çıkarımdır.":["The source merging rule and the σ rules (rounding allowance, {#0} % for smooth curves, {#1} ppm at the reference point, extra σ floor) are own inference.","Die Zusammenführungsregel und die σ-Regeln (Rundungsanteil, {#0} % bei glatten Kurven, {#1} ppm am Referenzpunkt, zusätzliche σ-Untergrenze) sind eigene Annahmen."],"Model kabul eşiği (χ²/N ≤ {#0}), model göreli belirsizliği (%{#1}) ve kısıt bırakma eşiği (Δχ² ≤ {#2}) kendi çıkarımdır.":["The model acceptance threshold (χ²/N ≤ {#0}), the model relative uncertainty ({#1} %) and the constraint release threshold (Δχ² ≤ {#2}) are own inference.","Die Modell-Annahmeschwelle (χ²/N ≤ {#0}), die relative Modellunsicherheit ({#1} %) und die Schwelle zum Aufheben der Bedingung (Δχ² ≤ {#2}) sind eigene Annahmen."],"Düzgünleştirmede α, {#0} °C düğümlerde merkezi farktır; veri aralığı dışına uzatma yapılmaz.":["In smoothing, α is the central difference on the {#0} °C nodes; there is no extrapolation outside the data range.","Bei der Glättung ist α die zentrale Differenz auf den {#0}-°C-Knoten; außerhalb des Datenbereichs wird nicht extrapoliert."],"Sonuç veri kadar iyidir: farklı kaynakların sistematik farkı yalnız sınır noktasında giderilir, aralık içinde ortalanmaz.":["The result is only as good as the data: the systematic difference between sources is removed only at the boundary point, not averaged within the range.","Das Ergebnis ist nur so gut wie die Daten: der systematische Unterschied zwischen Quellen wird nur am Grenzpunkt beseitigt, nicht im Bereich gemittelt."],"Faz dönüşümü, manyetik anomali (Invar) ve anizotropi modelde yoktur; böyle malzemelerde model reddedilir ya da yanlış olabilir.":["Phase transformation, magnetic anomaly (Invar) and anisotropy are not in the model; for such materials the model is rejected or may be wrong.","Phasenumwandlung, magnetische Anomalie (Invar) und Anisotropie sind im Modell nicht enthalten; bei solchen Werkstoffen wird das Modell verworfen oder kann falsch sein."],"α ≥ {#0} kırpması (model {#1} K yakınında eksi α verirse; veride eksi α varsa yapılmaz)":["α ≥ {#0} clipping (if the model gives negative α near {#1} K; not applied if the data show negative α)","α ≥ {#0} begrenzen (falls das Modell nahe {#1} K negatives α liefert; nicht angewandt, wenn die Daten negatives α zeigen)"],"α ≥ {#0} kırpması kapalı.":["α ≥ {#0} clipping is off.","α ≥ {#0} Begrenzung ist aus."],"Modelin eksi α’sı ≤ {#0} °C’de {#1}’a kırpıldı (Δχ² {#2}; veri eksi α göstermiyor).":["The model’s negative α at ≤ {#0} °C was clipped to {#1} (Δχ² {#2}; the data show no negative α).","Das negative Modell-α bei ≤ {#0} °C wurde auf {#1} begrenzt (Δχ² {#2}; die Daten zeigen kein negatives α)."],"Veride eksi α var (Δχ² {#0} > {#1}): kırpılmadı.":["The data show negative α (Δχ² {#0} > {#1}): not clipped.","Die Daten zeigen negatives α (Δχ² {#0} > {#1}): nicht begrenzt."],"α ≥ {#0} kırpması":["α ≥ {#0} clipping","α ≥ {#0} Begrenzung"],"Kapalı":["Off","Aus"],"Gerekmedi":["Not needed","Nicht nötig"],"Yapıldı: ≤ {#0} °C, ε düzeltmesi {#1} ppm, Δχ² {#2}":["Applied: ≤ {#0} °C, ε correction {#1} ppm, Δχ² {#2}","Angewandt: ≤ {#0} °C, ε-Korrektur {#1} ppm, Δχ² {#2}"],"Yapılmadı: veride eksi α (Δχ² {#0})":["Not applied: negative α in the data (Δχ² {#0})","Nicht angewandt: negatives α in den Daten (Δχ² {#0})"],"Model {#0} K yakınında eksi α verebilir (B·T teriminin işareti). Bu durumda eksi α {#1}’a kırpılır ve ε, kırpılan integral kadar düzeltilir; eksi bölgenin üstünde eğri değişmez. Kırpma veriyle sınanır: verinin kendi σ’sıyla Δχ² eşiği aşılıyorsa veride gerçek eksi α vardır ve kırpılmaz. B ≥ {#2} kısıtı denendi ve reddedildi, çünkü oda sıcaklığı α’sını kaydırıyordu (Ti {#3} °C: {#4} → {#5} ×{#6}⁻⁶/K). Kendi çıkarım.":["Near {#0} K the model can give negative α (sign of the B·T term). In that case the negative α is clipped to {#1} and ε is corrected by the clipped integral; above the negative region the curve is unchanged. The clipping is tested against the data: if Δχ² with the data’s own σ exceeds the threshold, the data show a real negative α and no clipping is done. A B ≥ {#2} constraint was tried and rejected because it shifted the room-temperature α (Ti at {#3} °C: {#4} → {#5} ×{#6}⁻⁶/K). Own inference.","Nahe {#0} K kann das Modell negatives α liefern (Vorzeichen des B·T-Terms). Dann wird das negative α auf {#1} begrenzt und ε um das begrenzte Integral korrigiert; oberhalb des negativen Bereichs bleibt die Kurve unverändert. Die Begrenzung wird an den Daten geprüft: überschreitet Δχ² mit dem eigenen σ der Daten die Schwelle, zeigen die Daten ein echtes negatives α und es wird nicht begrenzt. Eine Bedingung B ≥ {#2} wurde erprobt und verworfen, weil sie das α bei Raumtemperatur verschob (Ti bei {#3} °C: {#4} → {#5} ×{#6}⁻⁶/K). Eigene Annahme."]},"r":{"Optik CTE: sayı değil":["Optic CTE: not a number","WAK der Optik: keine Zahl"],"Optik CTE boş":["Optic CTE empty","WAK der Optik leer"],"Optik CTE ≤ {#0}":["Optic CTE ≤ {#0}","WAK der Optik ≤ {#0}"],"Optik CTE < {#0}":["Optic CTE < {#0}","WAK der Optik < {#0}"],"Optik CTE listede yok":["Optic CTE not in list","WAK der Optik nicht in der Liste"],"Optik yoğunluğu: sayı değil":["Optic density: not a number","Dichte der Optik: keine Zahl"],"Optik yoğunluğu boş":["Optic density empty","Dichte der Optik leer"],"Optik yoğunluğu ≤ {#0}":["Optic density ≤ {#0}","Dichte der Optik ≤ {#0}"],"Optik
