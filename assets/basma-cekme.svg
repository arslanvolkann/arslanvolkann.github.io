<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'Times New Roman', Times, serif">
  <defs>
    <!-- lens kesiti (sol kenar dalgali kirik cizgi) -->
    <clipPath id="lens">
      <path d="M44,74 Q330,52 640,100 L640,360 Q330,408 44,386 Q30,360 44,334 Q58,308 44,282 Q30,256 44,230 Q58,204 44,178 Q30,152 44,126 Q58,100 44,74 Z"/>
    </clipPath>
    <!-- gerilme alani: bag merkezinde basma (mavi), cevresinde cekme halkasi (kirmizi), uzakta notr -->
    <radialGradient id="stress" gradientUnits="userSpaceOnUse" cx="640" cy="230" r="260" gradientTransform="translate(640 230) scale(1 1.12) translate(-640 -230)">
      <stop offset="0" stop-color="#0b4fc0"/>
      <stop offset="0.14" stop-color="#2f74db"/>
      <stop offset="0.26" stop-color="#9cc6f2"/>
      <stop offset="0.33" stop-color="#f3e4e8"/>
      <stop offset="0.42" stop-color="#f08a8a"/>
      <stop offset="0.52" stop-color="#f4a2a2"/>
      <stop offset="0.68" stop-color="#f7dede"/>
      <stop offset="0.85" stop-color="#f3f5f8"/>
      <stop offset="1" stop-color="#f3f5f8"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#0b4fc0"/>
      <stop offset="0.25" stop-color="#6ea7ea"/>
      <stop offset="0.5" stop-color="#f7f8fb"/>
      <stop offset="0.75" stop-color="#f29696"/>
      <stop offset="1" stop-color="#d7262b"/>
    </linearGradient>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#d3d6db"/>
      <line x1="0" y1="0" x2="0" y2="16" stroke="#3a3f45" stroke-width="1.3"/>
    </pattern>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1257c9"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d7262b"/>
    </marker>
  </defs>

  <rect width="800" height="500" rx="14" fill="#ffffff"/>

  <!-- lens: gerilme alani + dis hat -->
  <g clip-path="url(#lens)"><rect x="0" y="0" width="800" height="500" fill="url(#stress)"/></g>
  <path d="M44,74 Q330,52 640,100 L640,360 Q330,408 44,386" fill="none" stroke="#1b1b1b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M44,74 Q58,100 44,126 Q30,152 44,178 Q58,204 44,230 Q30,256 44,282 Q58,308 44,334 Q30,360 44,386" fill="none" stroke="#1b1b1b" stroke-width="2"/>

  <!-- yuva: duz ic yuzey, lensle arasinda radyal bosluk (bag kalinligi) -->
  <rect x="676" y="44" width="100" height="372" fill="url(#hatch)" stroke="#1b1b1b" stroke-width="2.2"/>

  <!-- yapistirici: yalniz bosluktaki orta bant, lens kenari ve yuvaya yapisik -->
  <rect x="640" y="178" width="36" height="104" fill="#f6d36a" stroke="#1b1b1b" stroke-width="2"/>

  <!-- basma oklari: yapistiricidan lense -->
  <g stroke="#1257c9" stroke-width="4.5" stroke-linecap="round" marker-end="url(#aB)">
    <line x1="671" y1="200" x2="649" y2="200"/>
    <line x1="671" y1="230" x2="649" y2="230"/>
    <line x1="671" y1="260" x2="649" y2="260"/>
  </g>

  <!-- cekme oklari: halka boyunca tegetsel, eksenden uzaklasan -->
  <g fill="none" stroke="#d7262b" stroke-width="4" stroke-linecap="round" marker-end="url(#aR)">
    <path d="M512,170 A150 150 0 0 1 548,113"/>
    <path d="M512,290 A150 150 0 0 0 548,347"/>
  </g>

  <!-- semboller -->
  <g font-size="40" font-style="italic" fill="#111" text-anchor="middle">
    <text x="586" y="244">σ<tspan font-size="27" dy="8">c</tspan></text>
    <text x="472" y="244">σ<tspan font-size="27" dy="8">t</tspan></text>
  </g>

  <!-- renk cubugu -->
  <rect x="220" y="430" width="360" height="22" fill="url(#bar)" stroke="#1b1b1b" stroke-width="1.4"/>
  <line x1="400" y1="452" x2="400" y2="460" stroke="#1b1b1b" stroke-width="1.4"/>
  <g font-size="30" fill="#111" text-anchor="middle">
    <text x="200" y="452">−</text>
    <text x="400" y="488" font-size="26">0</text>
    <text x="602" y="452">+</text>
    <text x="640" y="452" font-style="italic">σ</text>
  </g>
</svg>
